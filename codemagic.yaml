workflows:
  ios:
    name: Totland iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - appstore # APP_STORE_CONNECT credentials plus CERTIFICATE_PRIVATE_KEY_BASE64
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install -g bun && bun install
      - name: Build web bundle
        script: bun run build:app
      - name: Capacitor sync
        script: bunx cap sync ios
      - name: Set up signing
        script: |
          set -euo pipefail

          if [ -z "${CERTIFICATE_PRIVATE_KEY_BASE64:-}" ]; then
            echo "Missing CERTIFICATE_PRIVATE_KEY_BASE64 in the Codemagic appstore group."
            echo "Add the Base64-encoded private key to that group, then rerun Totland iOS."
            exit 1
          fi

          KEY_FILE="$CM_BUILD_DIR/.ios_signing_key.pem"
          trap 'rm -f "$KEY_FILE"' EXIT
          if ! printf '%s' "$CERTIFICATE_PRIVATE_KEY_BASE64" | tr -d '[:space:]' | openssl base64 -d -A -out "$KEY_FILE"; then
            echo "CERTIFICATE_PRIVATE_KEY_BASE64 could not be decoded."
            echo "Recreate it with: base64 -w 0 totland_ios_signing_key"
            exit 1
          fi

          if ! openssl rsa -in "$KEY_FILE" -check -noout >/dev/null 2>&1; then
            echo "CERTIFICATE_PRIVATE_KEY_BASE64 does not decode to a valid RSA private key."
            echo "Encode totland_ios_signing_key, not totland_ios_signing_key.pub."
            exit 1
          fi

          export CERTIFICATE_PRIVATE_KEY="$(cat "$KEY_FILE")"
          echo "Certificate private key validated."

          keychain initialize

          PROFILE_DIRS=(
            "$HOME/Library/MobileDevice/Provisioning Profiles"
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          )
          for dir in "${PROFILE_DIRS[@]}"; do
            mkdir -p "$dir"
          done

          count_profiles() {
            TOTAL=0
            for dir in "${PROFILE_DIRS[@]}"; do
              N="$(ls -1 "$dir" 2>/dev/null | grep -Ec '\.(mobileprovision|provisionprofile)$' || true)"
              TOTAL=$((TOTAL + N))
            done
            echo "$TOTAL"
          }

          fetch_profile() {
            BUNDLE_ID="$1"
            echo "Fetching App Store signing files for $BUNDLE_ID ..."
            BEFORE="$(count_profiles)"
            app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
            AFTER="$(count_profiles)"
            echo "Provisioning profiles on disk: $BEFORE -> $AFTER"
            if [ "$AFTER" -eq 0 ]; then
              echo "ERROR: fetch-signing-files produced no provisioning profile for $BUNDLE_ID."
              echo "Register the identifier in Apple Developer > Identifiers and make sure the"
              echo "App Store Connect API key used by the Totland integration has App Manager or Admin role."
              exit 1
            fi
          }

          fetch_profile App.totland.kids
          fetch_profile App.totland.kids.Clip

          echo "Downloaded provisioning profiles:"
          for dir in "${PROFILE_DIRS[@]}"; do
            echo "--- $dir"
            ls -la "$dir" || true
          done


          keychain add-certificates
          xcode-project use-profiles

      - name: Install pods
        script: cd ios/App && pod install
      - name: Validate iOS signing assignments
        script: |
          set -euo pipefail

          cd ios/App
          SIGNING_REPORT="$CM_BUILD_DIR/ios-signing-report.txt"
          : > "$SIGNING_REPORT"

          echo "Available Apple Distribution identities:" | tee -a "$SIGNING_REPORT"
          IDENTITY_OUTPUT="$(security find-identity -v -p codesigning)"
          printf '%s\n' "$IDENTITY_OUTPUT" | sed -E 's/([0-9A-F]{40})/[certificate fingerprint]/g' | tee -a "$SIGNING_REPORT"
          if ! printf '%s\n' "$IDENTITY_OUTPUT" | grep -q 'Apple Distribution'; then
            echo "No valid Apple Distribution identity is installed in the build keychain." | tee -a "$SIGNING_REPORT"
            exit 1
          fi

          echo "Searching for installed provisioning profiles ..." | tee -a "$SIGNING_REPORT"



          python3 - "$SIGNING_REPORT" <<'PY'
          import os
          import plistlib
          import subprocess
          import sys
          from pathlib import Path

          report_path = Path(sys.argv[1])
          search_dirs = [
              Path(os.path.expanduser("~/Library/MobileDevice/Provisioning Profiles")),
              Path(os.path.expanduser("~/Library/Developer/Xcode/UserData/Provisioning Profiles")),
              Path(os.environ.get("CM_BUILD_DIR", ".")) / "provisioning_profiles",
          ]
          team_id = "ZGHUXQGJJ9"
          required = {
              "App.totland.kids": {
                  "com.apple.developer.associated-domains": None,
                  "com.apple.developer.associated-appclip-app-identifiers": [
                      f"{team_id}.App.totland.kids.Clip"
                  ],
              },
              "App.totland.kids.Clip": {
                  "com.apple.developer.associated-domains": None,
                  "com.apple.developer.on-demand-install-capable": True,
                  "com.apple.developer.parent-application-identifiers": [
                      f"{team_id}.App.totland.kids"
                  ],
              },
          }
          matches = {bundle_id: [] for bundle_id in required}
          lines = []

          def decode(path):
              """Return the profile plist, trying security first then openssl."""
              attempts = (
                  ["security", "cms", "-D", "-i", str(path)],
                  ["openssl", "smime", "-verify", "-noverify", "-inform", "DER", "-in", str(path)],
              )
              errors = []
              for command in attempts:
                  result = subprocess.run(command, capture_output=True, check=False)
                  if result.returncode == 0 and result.stdout:
                      try:
                          return plistlib.loads(result.stdout), None
                      except Exception as exc:  # noqa: BLE001
                          errors.append(f"{command[0]}: unreadable plist ({exc})")
                          continue
                  errors.append(
                      f"{command[0]}: exit {result.returncode} {result.stderr.decode(errors='replace').strip()[:160]}"
                  )
              return None, "; ".join(errors)

          found_any = False
          for directory in search_dirs:
              if not directory.is_dir():
                  lines.append(f"Searched {directory} - directory not present.")
                  continue
              profiles = sorted(directory.glob("*.mobileprovision")) + sorted(
                  directory.glob("*.provisionprofile")
              )
              lines.append(f"Searched {directory} - {len(profiles)} profile file(s).")
              for profile_path in profiles:
                  found_any = True
                  profile, error = decode(profile_path)
                  if profile is None:
                      lines.append(f"  WARNING: could not decode {profile_path.name}: {error}")
                      continue
                  entitlements = profile.get("Entitlements", {})
                  app_identifier = entitlements.get("application-identifier", "")
                  prefix = (profile.get("ApplicationIdentifierPrefix") or [""])[0]
                  bundle_id = app_identifier
                  if prefix and bundle_id.startswith(prefix + "."):
                      bundle_id = bundle_id[len(prefix) + 1 :]
                  else:
                      bundle_id = bundle_id.split(".", 1)[-1]
                  lines.append(
                      f"  {profile_path.name}: name={profile.get('Name')!r} bundle_id={bundle_id!r}"
                  )
                  if bundle_id in matches:
                      matches[bundle_id].append((profile_path, profile, entitlements))

          if not found_any:
              lines.append(
                  "ERROR: No provisioning profile files were installed by the signing step."
              )

          failed = not found_any
          for bundle_id, expected_entitlements in required.items():
              candidates = matches[bundle_id]
              if not candidates:
                  lines.append(
                      f"ERROR: No installed App Store provisioning profile matches {bundle_id}."
                  )
                  lines.append(
                      "  Next step on Apple's side: register this identifier in Apple Developer > "
                      "Identifiers, and confirm the App Store Connect API key behind the Totland "
                      "integration has the App Manager or Admin role so it can create profiles."
                  )
                  failed = True
                  continue
              profile_path, profile, entitlements = candidates[0]
              profile_name = profile.get("Name", profile_path.stem)
              missing = sorted(key for key in expected_entitlements if key not in entitlements)
              lines.append(f"OK: {bundle_id} uses profile {profile_name!r}.")
              if missing:
                  lines.append(
                      f"ERROR: {bundle_id} profile is missing entitlements: {', '.join(missing)}."
                  )
                  lines.append(
                      "  Enable the matching capabilities on the identifier in Apple Developer, "
                      "then rerun so a refreshed profile is downloaded."
                  )
                  failed = True
                  continue

              wrong_values = []
              for key, expected_value in expected_entitlements.items():
                  if expected_value is None:
                      continue
                  actual_value = entitlements.get(key)
                  if actual_value != expected_value:
                      wrong_values.append(
                          f"{key} expected {expected_value!r}, received {actual_value!r}"
                      )
              if wrong_values:
                  lines.append(
                      f"ERROR: {bundle_id} profile has an incorrect App Clip relationship: "
                      + "; ".join(wrong_values)
                      + "."
                  )
                  lines.append(
                      "  Confirm the clip is registered as an App Clip identifier belonging to "
                      "App.totland.kids, save both identifiers, and rerun to download refreshed profiles."
                  )
                  failed = True

          with report_path.open("a") as report:
              report.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          if failed:
              raise SystemExit(1)
          PY


          echo "Resolved release signing settings:" | tee -a "$SIGNING_REPORT"
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -showBuildSettings 2>&1 \
            | grep -E 'Build settings for action build and target|PRODUCT_BUNDLE_IDENTIFIER|PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY|CODE_SIGN_STYLE' \
            | tee -a "$SIGNING_REPORT"
      - name: Set unique build number
        script: |
          set -euo pipefail

          if printf '%s' "${BUILD_NUMBER:-}" | grep -Eq '^[1-9][0-9]*$'; then
            IOS_BUILD_NUMBER="$BUILD_NUMBER"
          else
            IOS_BUILD_NUMBER="$(date -u +%s)"
            echo "BUILD_NUMBER was unavailable; using UTC timestamp $IOS_BUILD_NUMBER."
          fi

          PROJECT_FILE="ios/App/App.xcodeproj/project.pbxproj"
          python3 - "$PROJECT_FILE" "$IOS_BUILD_NUMBER" <<'PY'
          import re
          import sys
          from pathlib import Path

          project_path = Path(sys.argv[1])
          build_number = sys.argv[2]
          project = project_path.read_text()
          updated, count = re.subn(
              r"CURRENT_PROJECT_VERSION = [^;]+;",
              f"CURRENT_PROJECT_VERSION = {build_number};",
              project,
          )
          if count != 4:
              raise SystemExit(
                  f"Expected to update 4 CURRENT_PROJECT_VERSION entries, updated {count}."
              )
          project_path.write_text(updated)
          print(f"Set iOS build number to {build_number} in {count} build configurations.")
          PY

          test "$(grep -c "CURRENT_PROJECT_VERSION = $IOS_BUILD_NUMBER;" "$PROJECT_FILE")" -eq 4
      - name: Build ipa
        script: |
          set -euo pipefail

          cd ios/App
          LOG_DIR="$CM_BUILD_DIR/ios-build-diagnostics"
          ARCHIVE_LOG="$LOG_DIR/archive.log"
          RESULT_BUNDLE="$LOG_DIR/AppArchive.xcresult"
          mkdir -p "$LOG_DIR"
          rm -rf "$RESULT_BUNDLE"

          set +e
          xcode-project build-ipa \
            --workspace App.xcworkspace \
            --scheme App \
            --archive-flags="-resultBundlePath $RESULT_BUNDLE" \
            2>&1 | tee "$ARCHIVE_LOG"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo
            echo "========== Relevant Xcode archive errors =========="
            grep -E -i -C 3 '(^|[[:space:]])error:|provisioning profile|requires a provisioning profile|doesn.t include|entitlement|code signing|signing certificate|SwiftCompile|CompileSwift|ARCHIVE FAILED|The following build commands failed' "$ARCHIVE_LOG" \
              | tail -n 250 || true
            echo "==================================================="
            echo "The complete archive output is available in the ios-build-diagnostics artifact."
            exit "$BUILD_STATUS"
          fi
    integrations:
      app_store_connect: Totland
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - ios-build-diagnostics/**/*
      - ios-signing-report.txt
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android:
    name: Totland Android
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      groups:
        - google_play # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      node: 20
      java: 21
      android_signing:
        - totland_keystore
    scripts:
      - name: Install dependencies
        script: npm install -g bun && bun install
      - name: Build web bundle
        script: bun run build:app
      - name: Capacitor sync
        script: bunx cap sync android
      - name: Build app bundle
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
