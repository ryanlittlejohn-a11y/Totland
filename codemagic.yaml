workflows:
  ios:
    name: Totland iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - totland # VITE_NATIVE_API_ORIGIN, VITE_REVENUECAT_IOS_KEY, VITE_REVENUECAT_ANDROID_KEY
        - appstore # APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_PRIVATE_KEY, CERTIFICATE_PRIVATE_KEY
      node: 20
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: App.totland.kids
    scripts:
      - name: Install dependencies
        script: npm install -g bun && bun install
      - name: Build web bundle
        script: bun run build:app
      - name: Capacitor sync
        script: bunx cap sync ios
      - name: Set up signing
        script: |
          keychain initialize
          app-store-connect bundle-ids create App.totland.kids || true
          app-store-connect certificates list --type IOS_DISTRIBUTION | grep -q IOS_DISTRIBUTION \
            || app-store-connect certificates create --type IOS_DISTRIBUTION
          app-store-connect fetch-signing-files App.totland.kids --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Install pods
        script: cd ios/App && pod install
      - name: Build ipa
        script: |
          cd ios/App
          xcode-project build-ipa --workspace App.xcworkspace --scheme App
    integrations:
      app_store_connect: Totland
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android:
    name: Totland Android
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      groups:
        - totland
        - google_play # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      node: 20
      java: 21
      android_signing:
        - totland_keystore
    scripts:
      - name: Install dependencies
        script: npm install -g bun && bun install
      - name: Build web bundle
        script: bun run build:app
      - name: Capacitor sync
        script: bunx cap sync android
      - name: Build app bundle
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
