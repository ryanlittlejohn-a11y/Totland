workflows:
  ios:
    name: Totland iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - appstore # APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_PRIVATE_KEY, CERTIFICATE_PRIVATE_KEY
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install -g bun && bun install
      - name: Build web bundle
        script: bun run build:app
      - name: Capacitor sync
        script: bunx cap sync ios
      - name: Set up signing
        script: |
          set -euo pipefail

          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "Missing CERTIFICATE_PRIVATE_KEY in the Codemagic appstore group."
            echo "Add a secure PEM private key to that group, then rerun Totland iOS."
            exit 1
          fi

          KEY_FILE="$CM_BUILD_DIR/.ios_signing_key.pem"
          printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" > "$KEY_FILE"

          if grep -q -- "BEGIN OPENSSH PRIVATE KEY" "$KEY_FILE"; then
            echo "Converting OpenSSH-format key to PEM."
            ssh-keygen -p -P "" -N "" -m PEM -f "$KEY_FILE" -q
          fi

          if ! openssl rsa -in "$KEY_FILE" -check -noout >/dev/null 2>&1; then
            rm -f "$KEY_FILE"
            echo "CERTIFICATE_PRIVATE_KEY is not a valid RSA private key."
            echo "Re-paste the FULL private key into the Codemagic appstore group:"
            echo "every line including -----BEGIN RSA PRIVATE KEY----- and -----END RSA PRIVATE KEY-----."
            echo "Do not paste the .pub file."
            exit 1
          fi

          export CERTIFICATE_PRIVATE_KEY="$(cat "$KEY_FILE")"
          rm -f "$KEY_FILE"
          echo "Certificate private key validated."

          keychain initialize
          app-store-connect fetch-signing-files App.totland.kids --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Install pods
        script: cd ios/App && pod install
      - name: Build ipa
        script: |
          cd ios/App
          xcode-project build-ipa --workspace App.xcworkspace --scheme App
    integrations:
      app_store_connect: Totland
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android:
    name: Totland Android
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      groups:
        - google_play # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      node: 20
      java: 21
      android_signing:
        - totland_keystore
    scripts:
      - name: Install dependencies
        script: npm install -g bun && bun install
      - name: Build web bundle
        script: bun run build:app
      - name: Capacitor sync
        script: bunx cap sync android
      - name: Build app bundle
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
